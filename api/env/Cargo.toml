[package]
name = "kernel-api-env"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
bitflags = "2"
erra = { version = "0.2.0", default-features = false }
mold = { package = "kernel-api-macros", path = "../macros" }
wire = { package = "kernel-api-wire", path = "../wire" }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
