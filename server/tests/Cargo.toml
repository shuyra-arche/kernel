[package]
name = "kernel-memory-tests"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

# A test-only workspace member; it does not depend on the RV64 Server crate.

[dependencies]
bitflags.workspace = true
erra.workspace = true
hashbrown = { version = "0.17.1", default-features = false, features = ["alloc", "default-hasher"] }
kernel-api = { path = "../../api" }
fack = { version = "0.2.0", default-features = false }
kernel-hardware-fixture = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "eb37b0b0db299513274864cec23cee509a3cd3cc" }

[[test]]
name = "memory"
path = "memory/mod.rs"

[[test]]
name = "translation"
path = "translation/mod.rs"

[[test]]
name = "fault"
path = "fault/mod.rs"

[[test]]
name = "iommu"
path = "iommu/mod.rs"

[[test]]
name = "hardware"
path = "hardware/mod.rs"

[[test]]
name = "sign"
path = "sign/mod.rs"

[[test]]
name = "pend"
path = "pend/mod.rs"

[[test]]
name = "address"
path = "address/mod.rs"

[[test]]
name = "name"
path = "name/mod.rs"

[[test]]
name = "unit"
path = "unit/mod.rs"

[[test]]
name = "room"
path = "room/mod.rs"

[[test]]
name = "sync"
path = "sync/mod.rs"

[[test]]
name = "allocator"
path = "allocator/mod.rs"

[[test]]
name = "registration"
path = "registration/mod.rs"

[[test]]
name = "invocation"
path = "invocation/mod.rs"

# Opt-in exploration; excluded from both the normal and ignored test runs.
[[bench]]
name = "ticket-storage"
path = "name/cost.rs"
harness = false

[[test]]
name = "context"
path = "context/mod.rs"

[[test]]
name = "console"
path = "console/mod.rs"

[[test]]
name = "interrupt"
path = "interrupt/mod.rs"

[[test]]
name = "latency"
path = "latency/mod.rs"

[[test]]
name = "diagnostics"
path = "diagnostics/mod.rs"

# Imported production synchronization code retains its provider feature gates.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("latency"))'] }
