[package]
name = "kernel-tests"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

# A test-only workspace member; it does not depend on the RV64 Server crate.

[dependencies]
bitflags.workspace = true
erra.workspace = true
hashbrown = { version = "0.17.1", default-features = false, features = ["alloc", "default-hasher"] }
kernel-api = { path = "../../api" }
fack = { version = "0.2.0", default-features = false }

[[test]]
name = "memory"
path = "basis/mod.rs"

[[test]]
name = "cell"
path = "basis/cell/mod.rs"

[[test]]
name = "flat"
path = "basis/flat/mod.rs"

[[test]]
name = "fabric"
path = "metal/generic/memory/mod.rs"

[[test]]
name = "translation"
path = "metal/riscv/mmu/mod.rs"

[[test]]
name = "fault"
path = "basis/nest/fault/mod.rs"

[[test]]
name = "iommu"
path = "metal/riscv/iommu/mod.rs"

[[test]]
name = "iommu-target"
path = "metal/riscv/iommu/execution/mod.rs"

[[test]]
name = "sign"
path = "basis/sign/mod.rs"

[[test]]
name = "pend"
path = "basis/pend/mod.rs"

[[test]]
name = "address"
path = "basis/nest/address/mod.rs"

[[test]]
name = "name"
path = "basis/name/mod.rs"

[[test]]
name = "unit"
path = "basis/unit/mod.rs"

[[test]]
name = "room"
path = "basis/room/mod.rs"

[[test]]
name = "sync"
path = "metal/riscv/sync/mod.rs"

[[test]]
name = "allocator"
path = "metal/allocator/mod.rs"

[[test]]
name = "registration"
path = "basis/pend/ledger/mod.rs"

[[test]]
name = "invocation"
path = "entry/call/mod.rs"

# Opt-in exploration; excluded from both the normal and ignored test runs.
[[bench]]
name = "ticket-storage"
path = "basis/name/cost.rs"
harness = false

[[test]]
name = "context"
path = "metal/riscv/switcher/context/mod.rs"

[[test]]
name = "console"
path = "metal/riscv/console/mod.rs"

[[test]]
name = "interrupt"
path = "basis/room/interrupt/mod.rs"

[[test]]
name = "latency"
path = "metal/measure/mod.rs"

[[test]]
name = "diagnostics"
path = "entry/report/mod.rs"

[[test]]
name = "activity"
path = "basis/nest/memo/activity/mod.rs"

[[test]]
name = "retirement"
path = "basis/nest/index/mod.rs"

# Imported production synchronization code retains its provider feature gates.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("latency"))'] }

[[test]]
name = "layout"
path = "metal/riscv/layout/mod.rs"
