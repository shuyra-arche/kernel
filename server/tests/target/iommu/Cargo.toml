[package]
name = "kernel-iommu-guest"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "iommu-guest"
path = "main.rs"
test = false
bench = false

[dependencies]
kernel-api = { path = "../../../../api" }
fdt = { version = "0.1.5", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
