[package]
name = "memory-platform"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "memory-platform"
path = "main.rs"
test = false
bench = false

[dependencies]
kernel-api.workspace = true
kernel.workspace = true
platform-riscv = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "f2dfa14f5b1f7bd47ee84841ba5c7112e8475950", default-features = false }
fdt = { version = "0.1.5", default-features = false }
spin = { version = "0.10", default-features = false, features = ["once"] }
