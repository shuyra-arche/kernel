[package]
name = "memory-guest"
version = "0.0.0"
edition = "2024"
publish = false
build = "../pinned/build.rs"

[workspace]
resolver = "2"
members = ["platform"]
default-members = [".", "platform"]

[workspace.dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }

[dependencies]
kernel-api.workspace = true
kernel-client.workspace = true

[[bin]]
name = "memory-guest"
path = "../realtime.rs"
test = false
bench = false

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
