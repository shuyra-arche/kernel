[package]
name = "kernel-iommu-guest"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "iommu-guest"
path = "main.rs"
test = false
bench = false

[dependencies]
kernel-api = { path = "../../../../api" }
fdt = { version = "0.1.5", default-features = false }
platform-riscv = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "8127d85230176b2483669d2242d62ef33bd36f6c", default-features = false }
kernel-hardware-fixture = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "8127d85230176b2483669d2242d62ef33bd36f6c" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[patch."https://github.com/shuyra-arche/kernel.git"]
kernel-api = { path = "../../../../api" }
