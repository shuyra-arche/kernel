[package]
name = "kernel-iommu-guest"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "iommu-guest"
path = "main.rs"
test = false
bench = false

[dependencies]
kernel-api = { path = "../../../../api" }
kernel-hardware-fixture = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "4531bcd2e73a945a67333cf2f614f0e01edeaaed" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[patch."https://github.com/shuyra-arche/kernel.git"]
kernel-api = { path = "../../../../api" }
