[package]
name = "kernel-verification"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[lib]
path = "lib.rs"
doctest = false

[[bin]]
name = "verify"
path = "main.rs"

[[test]]
name = "contracts"
path = "tests/mod.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"

libc = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
