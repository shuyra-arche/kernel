[package]
name = "kernel-verification"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "verify"
path = "main.rs"

[[test]]
name = "contracts"
path = "tests/mod.rs"

[dependencies]
vanllia-verification = { git = "https://github.com/shuyra-arche/vanllia.git", rev = "fba906f74cf56b275603c4370b736cde1b0cea20" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"
