name: IOMMU target QEMU

# Target-only evidence. This does not replace Vanllia's ABI/product QEMU suite.
on:
  pull_request:
    paths:
      - '.github/workflows/iommu-target.yml'
      - 'server/tests/metal/riscv/iommu/execution/**'
      - 'server/tests/target/metal/riscv/iommu/**'
      - 'server/tests/support/iommu/**'
      - 'server/src/basis/nest/translation/external/**'
      - 'server/src/basis/nest/memo/publication/receipt.rs'
      - 'server/src/metal/riscv/mmu/external/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-iommu-target-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  iommu-target:
    name: IOMMU QEMU MMIO and DMA
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: nightly
      QEMU_RISCV64: qemu-system-riscv64
    steps:
      - name: Install target tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential qemu-system-riscv openssl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" \
            --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify emulator and compiler
        run: |
          set -euo pipefail
          qemu-system-riscv64 --version
          rustc -Vv
          cargo -V
      - name: Run target-owned IOMMU scenarios
        run: |
          set -euo pipefail
          cargo +nightly test --locked -p kernel-memory-tests --test iommu-target \
            --target x86_64-unknown-linux-gnu -- --ignored --nocapture
      - name: Preserve QEMU execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iommu-qemu-evidence
          if-no-files-found: warn
          path: server/tests/target/metal/riscv/iommu/target/evidence/
