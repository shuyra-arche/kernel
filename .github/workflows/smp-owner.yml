name: Kernel explicit ABI13 completion qualification

# This workflow is never selected by ordinary CI. It is enabled for this
# one-time owner migration review or by explicit manual dispatch. Only 1 Hart
# is used in the automated equivalence check; SMP >=2 Hart is manual-only.
on:
  pull_request:
    paths:
      - ".github/workflows/smp-owner.yml"
      - "server/tests/runner/**"
      - "server/tests/target/smp/**"
      - "server/tests/target/metal/riscv/mmu/completion/**"
      - "server/tests/target/basis/unit/lifecycle/**"
      - "server/tests/target/basis/nest/retirement/**"
      - "server/tests/target/basis/room/shutdown/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-owner-smp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  qualification:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, 'Owner SMP migration: verify')
    name: ABI13 ${{ matrix.case }} / h1
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { case: smp, kind: smp, variation: base }
          - { case: lifecycle, kind: lifecycle, variation: base }
          - { case: lifecycle-cancel, kind: lifecycle, variation: cancel }
          - { case: lifecycle-pressure, kind: lifecycle, variation: pressure }
          - { case: lifecycle-pressure-cancel, kind: lifecycle, variation: both }
          - { case: retirement, kind: retirement, variation: base }
          - { case: retirement-cancel, kind: retirement, variation: cancel }
          - { case: shutdown, kind: shutdown, variation: base }
          - { case: shutdown-quiet, kind: shutdown, variation: quiet }
    env:
      RUSTUP_TOOLCHAIN: nightly
      QEMU_RISCV64: qemu-system-riscv64
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install exact target and execution prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select final ABI13 Kernel source with all four probe owners
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/kernel
          ref: b1062f60bfe96e625ed140952d9662319c70087e
          path: .integration/provider
          persist-credentials: false
      - name: Execute Kernel-owned ABI13 native and receipt contracts
        env:
          KIND: ${{ matrix.kind }}
          VARIATION: ${{ matrix.variation }}
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          runner="$GITHUB_WORKSPACE/server/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify"
          args=()
          case "$VARIATION" in
            base) ;;
            cancel) args+=(--cancel) ;;
            pressure) args+=(--pressure) ;;
            both) args+=(--cancel --pressure) ;;
            quiet) args+=(--quiet) ;;
            *) echo "invalid verification variation" >&2; exit 1 ;;
          esac
          "$runner" "$KIND" --kernel "$GITHUB_WORKSPACE/.integration/provider" \
            --output "$GITHUB_WORKSPACE/.integration/evidence" \
            --profile release --harts 1 "${args[@]}"
      - name: Expose failed source/build/target evidence
        if: failure()
        run: |
          for file in .integration/evidence/candidate/resolve/stderr.log .integration/evidence/candidate/locked/stderr.log .integration/evidence/candidate/harts-1-round-0/serial.log; do
            if [[ -f "$file" ]]; then
              echo "---- $file ----"
              tail -n 120 "$file"
            fi
          done
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abi13-owner-${{ matrix.case }}-h1
          include-hidden-files: true
          path: .integration/evidence/
          if-no-files-found: warn
