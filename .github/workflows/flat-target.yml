name: Kernel Flat target QEMU

# A Kernel-private target suite. Vanllia supplies a pinned platform fixture,
# not the test assertions or their CI matrix.
on:
  pull_request:
    paths:
      - ".github/workflows/flat-target.yml"
      - "server/tests/runner/**"
      - "server/tests/target/basis/flat/**"
      - "server/src/basis/flat/**"
      - "server/src/basis/nest/**"
      - "server/src/basis/pend/**"
      - "server/src/metal/riscv/mmu/**"
      - "api/**"
      - "client/**"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flat-target.yml"
      - "server/tests/runner/**"
      - "server/tests/target/basis/flat/**"
      - "server/src/basis/flat/**"
      - "server/src/basis/nest/**"
      - "server/src/basis/pend/**"
      - "server/src/metal/riscv/mmu/**"
      - "api/**"
      - "client/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: kernel-flat-target-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flat-target:
    name: Flat / ${{ matrix.profile }} / 1+4 Harts
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    env:
      RUSTUP_TOOLCHAIN: nightly
      QEMU_RISCV64: qemu-system-riscv64
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install target and execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select reviewed platform fixture
        id: fixture
        run: |
          pin=$(cat server/tests/runner/fixture)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/vanllia
          ref: ${{ steps.fixture.outputs.sha }}
          path: .integration/fixture
          persist-credentials: false
      - name: Execute Kernel-owned Flat contracts
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          cargo build --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          runner="$GITHUB_WORKSPACE/server/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify"
          "$runner" flat --kernel "$GITHUB_WORKSPACE" --fixture "$GITHUB_WORKSPACE/.integration/fixture" \
            --output "$GITHUB_WORKSPACE/.integration/evidence" --profile "$PROFILE" --harts 1 4
      - name: Preserve source and guest execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-flat-${{ matrix.profile }}-1-4-harts
          include-hidden-files: true
          path: .integration/evidence/
          if-no-files-found: warn
