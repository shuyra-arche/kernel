name: Kernel pinned target contracts

# A reusable owner-side regression for the immutable ABI13 Kernel selected by
# consumers. It does not qualify the current Kernel main ABI or an unrelated PR.
on:
  workflow_call:
    inputs:
      kernel_sha:
        description: Exact published Kernel revision under test
        type: string
        required: true
  workflow_dispatch:
    inputs:
      kernel_sha:
        description: Exact published Kernel revision under test
        type: string
        required: true
        default: 789ffd19b5359f3de172fb9aad8a61f6a7113a64
  pull_request:
    paths:
      - ".github/workflows/pinned-target.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pinned-target.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pinned-target-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qemu:
    name: ${{ matrix.scenario }} / ${{ matrix.profile }} / h1
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { scenario: activity, profile: debug }
          - { scenario: activity, profile: release }
          - { scenario: unsupported, profile: release }
          - { scenario: stopped, profile: release }
          - { scenario: irq, profile: debug }
          - { scenario: irq, profile: release }
    env:
      RUSTUP_TOOLCHAIN: nightly
      QEMU_RISCV64: qemu-system-riscv64
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install target and execution tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Admit exact Kernel source revision
        env:
          KERNEL_SHA: ${{ inputs.kernel_sha || '789ffd19b5359f3de172fb9aad8a61f6a7113a64' }}
        run: |
          [[ "$KERNEL_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/kernel
          ref: ${{ inputs.kernel_sha || '789ffd19b5359f3de172fb9aad8a61f6a7113a64' }}
          path: .integration/kernel
          persist-credentials: false
      - name: Read the Kernel-owned published fixture pin
        id: fixture
        run: |
          set -euo pipefail
          pin=$(cat .integration/kernel/server/tests/runner/fixture)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/vanllia
          ref: ${{ steps.fixture.outputs.sha }}
          path: .integration/fixture
          persist-credentials: false
      - name: Run Kernel-owned target contracts
        env:
          SCENARIO: ${{ matrix.scenario }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          kernel="$GITHUB_WORKSPACE/.integration/kernel"
          fixture="$GITHUB_WORKSPACE/.integration/fixture"
          evidence="$GITHUB_WORKSPACE/.integration/evidence"
          cargo build --locked --manifest-path "$kernel/server/tests/runner/Cargo.toml" --target x86_64-unknown-linux-gnu
          runner="$kernel/server/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify"
          case "$SCENARIO" in
            activity) args=(activity) ;;
            unsupported) args=(activity --unsupported) ;;
            stopped) args=(activity --stopped) ;;
            irq) args=(room --mode irq --events 16) ;;
            *) exit 1 ;;
          esac
          "$runner" "${args[@]}" --profile "$PROFILE" --harts 1 --kernel "$kernel" --fixture "$fixture" --output "$evidence"
      - name: Preserve exact source and QEMU evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-${{ matrix.scenario }}-${{ matrix.profile }}-h1
          include-hidden-files: true
          path: |
            .integration/evidence/inputs.json
            .integration/evidence/order.json
            .integration/evidence/candidate/inputs.json
            .integration/evidence/candidate/*.elf
            .integration/evidence/candidate/*.bin
            .integration/evidence/candidate/*.lock
            .integration/evidence/candidate/patches/*
            .integration/evidence/candidate/resolve/*
            .integration/evidence/candidate/locked/*
            .integration/evidence/candidate/harts-*/*.log
            .integration/evidence/candidate/harts-*/result.json
            .integration/evidence/candidate/harts-*/cleanup.json
          if-no-files-found: warn
