name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  build:
    name: RV64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CI toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,rustfmt,clippy --target riscv64gc-unknown-none-elf
      - name: Test workspace on host
        run: cargo test --locked --workspace --target x86_64-unknown-linux-gnu
      - name: Build workspace (debug)
        run: cargo build --locked --workspace --target riscv64gc-unknown-none-elf
      - name: Build workspace (release)
        run: cargo build --locked --workspace --release --target riscv64gc-unknown-none-elf
      - name: Build optional crash reporting
        run: cargo build --locked -p kernel --all-features --target riscv64gc-unknown-none-elf

  guest:
    name: Guest tests (QEMU)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install guest test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain nightly --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch external QEMU fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: shuyra-arche/vanllia
          ref: 5555b1d26e7c8ea5c34f6ab201bcf344cd98d8b9
          path: .integration/vanllia
          sparse-checkout: |
            platform/riscv
            tests/platform
          persist-credentials: false
      - name: Bind fixture to the Kernel under test
        run: |
          for relative in platform/riscv tests/platform/qemu; do
            manifest="$GITHUB_WORKSPACE/.integration/vanllia/$relative/Cargo.toml"
            cat >> "$manifest" <<EOF

          [patch."https://github.com/shuyra-arche/kernel.git"]
          kernel = { path = "$GITHUB_WORKSPACE/server" }
          kernel-api = { path = "$GITHUB_WORKSPACE/api" }
          EOF
            cargo metadata --manifest-path "$manifest" --format-version 1 >/dev/null
          done
          echo "KERNEL_BOOT_MANIFEST=$GITHUB_WORKSPACE/.integration/vanllia/platform/riscv/Cargo.toml" >> "$GITHUB_ENV"
          echo "KERNEL_PLATFORM_MANIFEST=$GITHUB_WORKSPACE/.integration/vanllia/tests/platform/qemu/Cargo.toml" >> "$GITHUB_ENV"
      - name: Run environment-dependent tests
        run: cargo test --locked --workspace --target x86_64-unknown-linux-gnu -- --ignored --nocapture
      - name: Preserve hardware evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guest-evidence
          path: server/tests/guest/*/target/evidence/
          if-no-files-found: warn
