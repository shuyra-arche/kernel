name: Check

# Documentation-only changes do not need Kernel builds or QEMU tests.
# Mixed source/documentation changes still run the complete checks.
# workflow_call intentionally remains unfiltered for releases.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_call:

permissions:
  contents: read

# PR updates supersede old work. Other runs have unique groups: main and
# reusable release checks must neither cancel nor evict one another from a queue.
concurrency:
  group: kernel-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check repository contracts
        run: |
          bash tools/tests/layout.sh
          bash tools/tests/release.sh
          bash tools/check-layout.sh
          bash tools/check-tooling.sh
      - name: Install host toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Identify compiler
        id: compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache host compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
            server/tests/runner/target
          key: kernel-host-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.lock', 'server/tests/runner/Cargo.lock', '**/Cargo.toml', '.github/workflows/check.yml') }}
          restore-keys: |
            kernel-host-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-
      - name: Check formatting and runner
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path server/tests/runner/Cargo.toml -- --check
          cargo clippy --locked --manifest-path server/tests/runner/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu -- -Dwarnings
      - name: Test host contracts
        env:
          RUSTFLAGS: "-Dwarnings"
        run: |
          cargo test --locked --workspace --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu

  rv64:
    name: RV64 (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install target toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --target riscv64gc-unknown-none-elf
      - name: Identify compiler
        id: compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache target compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: kernel-rv64-v3-${{ matrix.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            kernel-rv64-v3-${{ matrix.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-
      - name: Build workspace
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          args=()
          if [[ "$PROFILE" == release ]]; then args+=(--release); fi
          cargo build --locked --workspace --target riscv64gc-unknown-none-elf "${args[@]}"
