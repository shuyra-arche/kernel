name: Check

# Documentation-only changes do not need Kernel builds or QEMU tests.
# Mixed source/documentation changes still run the complete checks.
# workflow_call intentionally remains unfiltered for releases.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_call:

permissions:
  contents: read

# PR updates supersede old work. Other runs have unique groups: main and
# reusable release checks must neither cancel nor evict one another from a queue.
concurrency:
  group: kernel-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  changes:
    name: Select affected verification
    runs-on: ubuntu-latest
    outputs:
      guest: ${{ steps.scope.outputs.guest }}
      native: ${{ steps.scope.outputs.native }}
      smp: ${{ steps.scope.outputs.smp }}
      activity: ${{ steps.scope.outputs.activity }}
      flat: ${{ steps.scope.outputs.flat }}
      room: ${{ steps.scope.outputs.room }}
      system: ${{ steps.scope.outputs.system }}
      iommu: ${{ steps.scope.outputs.iommu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tools/verification-scope.sh

  build:
    name: Host and RV64 checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check layout and native tooling contracts
        run: |
          bash tools/tests/layout.sh
          bash tools/tests/release.sh
          bash tools/check-layout.sh
          bash tools/check-tooling.sh
      - name: Install CI toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,rustfmt,clippy --target riscv64gc-unknown-none-elf
      - name: Identify compiler
        id: compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            server/tests/runner/target
          key: rust-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/check.yml') }}
          restore-keys: |
            rust-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path server/tests/runner/Cargo.toml -- --check
      - name: Test host contracts
        env:
          RUSTFLAGS: "-Dwarnings"
        run: |
          cargo test --locked --workspace --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Build RV64 workspace (debug and release)
        run: |
          cargo build --locked --workspace --target riscv64gc-unknown-none-elf
          cargo build --locked --workspace --release --target riscv64gc-unknown-none-elf

  guest:
    name: Affected RV64 scenarios (QEMU)
    needs: changes
    if: needs.changes.outputs.guest == 'true'
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    env:
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install native image tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch native composition and execution library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/vanllia
          ref: 50ebf0feaae16374ba431f83a515fe6ce273c8b7
          path: .integration/vanllia
          persist-credentials: false
      - name: Build host runners
        env:
          RUSTFLAGS: "-Dwarnings"
        run: |
          cargo build --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo build --locked --manifest-path .integration/vanllia/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          echo "$GITHUB_WORKSPACE/server/tests/runner/target/x86_64-unknown-linux-gnu/debug" >> "$GITHUB_PATH"
          cp .integration/vanllia/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify /tmp/native-verify
      - name: Check current native ABI 11 memory and reject ABI 10 Capsule
        if: needs.changes.outputs.native == 'true'
        run: |
          for profile in debug release; do
            /tmp/native-verify native --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output ".integration/native-$profile" --profile "$profile"
          done
          /tmp/native-verify native --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/native-reject --capsule-version 10
      - name: Check CPU completion (debug/release, 1/2/4 Harts)
        if: needs.changes.outputs.smp == 'true'
        run: |
          for profile in debug release; do
            verify smp --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output ".integration/smp-$profile" --profile "$profile"
          done
      - name: Check activity (debug/release, qualified/unqualified, stopped observer, 1/4 Harts)
        if: needs.changes.outputs.activity == 'true'
        run: |
          for profile in debug release; do
            verify activity --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output ".integration/activity-$profile" --profile "$profile"
          done
          verify activity --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/activity-unsupported --profile release --unsupported
          verify activity --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/activity-stopped --profile release --stopped
      - name: Check implicit Flat (debug/release, 1/4 Harts)
        if: needs.changes.outputs.flat == 'true'
        run: |
          for profile in debug release; do
            verify flat --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output ".integration/flat-$profile" --profile "$profile"
          done
      - name: Check Room/IRQ correctness (debug/release)
        if: needs.changes.outputs.room == 'true'
        run: |
          for profile in debug release; do
            verify room --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output ".integration/irq-$profile" --mode irq --events 16 --profile "$profile"
            verify room --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output ".integration/realtime-$profile" --mode realtime --profile "$profile" --harts 4
          done
      - name: Check standalone IOMMU backend
        if: needs.changes.outputs.iommu == 'true'
        run: cargo test --locked -p kernel-memory-tests --test iommu-target --target x86_64-unknown-linux-gnu -- --ignored --nocapture
      - name: Fetch System regression
        if: needs.changes.outputs.system == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/system
          ref: 7e4f9dc19bdaf4a0e95ff3b557fdc8959b8547d7
          path: .integration/system
          persist-credentials: false
      - name: Fetch Twine Release recovery
        if: needs.changes.outputs.system == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/twine
          ref: 7c75c62d15d173032d99fed54ca7fd00337d787b
          path: .integration/twine
          persist-credentials: false
      - name: Check System consumer (release, 1/4 Harts)
        if: needs.changes.outputs.system == 'true'
        run: /tmp/native-verify system --kernel "$GITHUB_WORKSPACE" --fixture .integration/system --twine .integration/twine --output .integration/system-runtime
      - name: Preserve every execution and build result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rv64-evidence
          include-hidden-files: true
          path: |
            .integration/*/order.json
            .integration/*/inputs.json
            .integration/*/*.elf
            .integration/*/*.bin
            .integration/*/*.lock
            .integration/*/boot/*
            .integration/*/build/*
            .integration/*/resolve/*
            .integration/*/harts-*/*.json
            .integration/*/harts-*/*.log
            .integration/*/*/inputs.json
            .integration/*/*/*.elf
            .integration/*/*/*.bin
            .integration/*/*/*.lock
            .integration/*/*/patches/*
            .integration/*/*/harts-*/*.json
            .integration/*/*/harts-*/*.log
            .integration/*/*/locked/*
            .integration/*/*/resolve/*
            server/tests/target/metal/riscv/iommu/target/evidence/*
          if-no-files-found: error

  room-comparison:
    name: Opt-in Room comparison
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.body, 'Room comparison: requested')
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    env:
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install comparison tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build comparison runner
        run: |
          cargo build --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          echo "$GITHUB_WORKSPACE/server/tests/runner/target/x86_64-unknown-linux-gnu/debug" >> "$GITHUB_PATH"
      - name: Select published control
        id: control
        run: verify baseline --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Fetch control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.control.outputs.sha }}
          path: .integration/room-control
          persist-credentials: false
      - name: Fetch composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/vanllia
          ref: 50ebf0feaae16374ba431f83a515fe6ce273c8b7
          path: .integration/vanllia
          persist-credentials: false
      - name: Compare fixed workloads
        run: |
          for mode in room irq; do
            verify room --kernel "$GITHUB_WORKSPACE" --baseline .integration/room-control --fixture .integration/vanllia --output ".integration/compare-$mode-on" --mode "$mode" --profile release --rounds 5
            verify room --kernel "$GITHUB_WORKSPACE" --baseline .integration/room-control --fixture .integration/vanllia --output ".integration/compare-$mode-off" --mode "$mode" --profile release --rounds 5 --no-latency
          done
          verify room --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/compare-warmup --mode room --profile release --harts 1 --rounds 5 --compare-room-warmup
      - name: Preserve comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-comparison
          include-hidden-files: true
          path: |
            .integration/compare-*/order.json
            .integration/compare-*/*/inputs.json
            .integration/compare-*/*/*.elf
            .integration/compare-*/*/*.bin
            .integration/compare-*/*/*.lock
            .integration/compare-*/*/patches/*
            .integration/compare-*/*/harts-*/*.log
            .integration/compare-*/*/harts-*/result.json
            .integration/compare-*/*/locked/*
            .integration/compare-*/*/resolve/*
          if-no-files-found: warn
