name: Check

# Documentation-only changes do not need Kernel builds or QEMU tests.
# Mixed source/documentation changes still run the complete checks.
# workflow_call intentionally remains unfiltered for releases.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_call:

permissions:
  contents: read

# PR updates supersede old work. Other runs have unique groups: main and
# reusable release checks must neither cancel nor evict one another from a queue.
concurrency:
  group: kernel-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  build:
    name: RV64 build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Rust module layout
        run: |
          bash tools/tests/layout.sh
          bash tools/check-layout.sh
      - name: Test QEMU partition contract
        run: python3 server/tests/hardware/tests/shard.py
      - name: Install CI toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,rustfmt,clippy --target riscv64gc-unknown-none-elf
      - name: Identify compiler
        id: compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/check.yml') }}
          restore-keys: |
            rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-
      - name: Test workspace on host
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo test --locked --workspace --target x86_64-unknown-linux-gnu
      - name: Build workspace (debug)
        run: cargo build --locked --workspace --target riscv64gc-unknown-none-elf
      - name: Build workspace (release)
        run: cargo build --locked --workspace --release --target riscv64gc-unknown-none-elf

  guest:
    name: Guest tests (QEMU)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    env:
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
      RUSTFLAGS: "-Crelocation-model=static -Cforce-frame-pointers=yes -Ccode-model=medium -Dwarnings"
    steps:
      - name: Install native image tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch native QEMU composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/vanllia
          ref: dd32c35dbb67e2e78edb00ad35f968d16423249e
          path: .integration/vanllia
          sparse-checkout: |
            tests/memory
            platform/riscv
          persist-credentials: false
      - name: Trust checked-out compositions in the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.integration/vanllia"
      - name: Adapt pinned native fixture to the current provider
        run: python3 server/tests/guest/native/prepare.py --fixture .integration/vanllia
      - name: Run current native provider (debug)
        run: python3 .integration/vanllia/tests/memory/run.py --kernel "$GITHUB_WORKSPACE"
      - name: Reject ABI 10 Capsule
        run: python3 .integration/vanllia/tests/memory/run.py --kernel "$GITHUB_WORKSPACE" --no-build --capsule-version 10
      - name: Run current native provider (release)
        run: python3 .integration/vanllia/tests/memory/run.py --kernel "$GITHUB_WORKSPACE" --profile release
      - name: Check native CPU completion (debug, 1/2/4 Harts)
        run: python3 server/tests/guest/smp/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/smp-debug
      - name: Check native CPU completion (release, 1/2/4 Harts)
        run: python3 server/tests/guest/smp/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/smp-release --profile release
      - name: Fetch pinned System runtime regression
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/system
          ref: 7e4f9dc19bdaf4a0e95ff3b557fdc8959b8547d7
          path: .integration/system
          persist-credentials: false
      - name: Fetch pinned Twine Release recovery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/twine
          ref: 7c75c62d15d173032d99fed54ca7fd00337d787b
          path: .integration/twine
          persist-credentials: false
      - name: Check System native runtime (release, 1/4 Harts)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.integration/system"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.integration/twine"
          python3 server/tests/guest/smp/system.py --twine .integration/twine --kernel "$GITHUB_WORKSPACE" --fixture .integration/system --output .integration/system-runtime
      - name: Preserve System runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-native-runtime
          path: |
            .integration/system-runtime/*.json
            .integration/system-runtime/*.log
            .integration/system-runtime/*.lock
            .integration/system-runtime/*.elf
            .integration/system-runtime/initrd.bin
          if-no-files-found: warn
      - name: Preserve native CPU completion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-cpu-smp
          include-hidden-files: true
          path: |
            .integration/smp-*/inputs.json
            .integration/smp-*/composition.diff
            .integration/smp-*/build.log
            .integration/smp-*/Cargo.lock
            .integration/smp-*/provider/Cargo.lock
            .integration/smp-*/harts-*/*.log
            .integration/smp-*/harts-*/result.json
            .integration/smp-*/initrd.bin
            .integration/smp-*/fixture/tests/memory/target/riscv64gc-unknown-none-elf/debug/memory-guest
            .integration/smp-*/fixture/tests/memory/target/riscv64gc-unknown-none-elf/debug/memory-platform
            .integration/smp-*/fixture/tests/memory/target/riscv64gc-unknown-none-elf/release/memory-guest
            .integration/smp-*/fixture/tests/memory/target/riscv64gc-unknown-none-elf/release/memory-platform
          if-no-files-found: warn
      - name: Check CPU activity (debug, 1/4 Harts)
        run: python3 server/tests/guest/activity/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/activity-debug --profile debug
      - name: Check CPU activity (release, 1/4 Harts)
        run: python3 server/tests/guest/activity/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/activity-release
      - name: Reject unqualified Svade activity (1/4 Harts)
        run: python3 server/tests/guest/activity/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/activity-unsupported --unsupported
      - name: Check stopped observation Task (1/4 Harts)
        run: python3 server/tests/guest/activity/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/activity-stopped --stopped
      - name: Preserve CPU activity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-activity
          include-hidden-files: true
          path: |
            .integration/activity-*/inputs.json
            .integration/activity-*/composition.diff
            .integration/activity-*/build.log
            .integration/activity-*/harts-*/*.log
            .integration/activity-*/harts-*/result.json
            .integration/activity-*/fixture/tests/memory/Cargo.lock
            .integration/activity-*/fixture/tests/memory/target/riscv64gc-unknown-none-elf/debug/memory-guest
            .integration/activity-*/fixture/tests/memory/target/riscv64gc-unknown-none-elf/debug/memory-platform
            .integration/activity-*/fixture/tests/memory/target/riscv64gc-unknown-none-elf/release/memory-guest
            .integration/activity-*/fixture/tests/memory/target/riscv64gc-unknown-none-elf/release/memory-platform
          if-no-files-found: warn
      - name: Check implicit Flat contracts (debug, 1/4 Harts)
        run: python3 server/tests/guest/flat/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/flat-debug
      - name: Check implicit Flat contracts (release, 1/4 Harts)
        run: python3 server/tests/guest/flat/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/flat-release --profile release
      - name: Check native UART contracts (debug, 1/4 Harts)
        run: python3 server/tests/latency/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/room-irq-debug --mode irq --events 16 --profile debug --rounds 1
      - name: Check native UART contracts (release, 1/4 Harts)
        run: python3 server/tests/latency/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/room-irq-release --mode irq --events 16 --profile release --rounds 1
      - name: Check native scheduling contracts (debug, 4 Harts)
        run: python3 server/tests/latency/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/room-rt-debug --mode realtime --profile debug --rounds 1 --harts 4
      - name: Check native scheduling contracts (release, 4 Harts)
        run: python3 server/tests/latency/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/room-rt-release --mode realtime --profile release --rounds 1 --harts 4
      - name: Preserve native Room evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-room
          include-hidden-files: true
          path: |
            .integration/room-*/order.json
            .integration/room-*/candidate/inputs.json
            .integration/room-*/candidate/composition.diff
            .integration/room-*/candidate/build.log
            .integration/room-*/candidate/harts-*/*.log
            .integration/room-*/candidate/harts-*/result.json
            .integration/room-*/candidate/composition/tests/memory/Cargo.lock
            .integration/room-*/candidate/composition/tests/memory/target/riscv64gc-unknown-none-elf/debug/memory-*
            .integration/room-*/candidate/composition/tests/memory/target/riscv64gc-unknown-none-elf/release/memory-*
          if-no-files-found: warn
      - name: Preserve implicit Flat evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implicit-flat
          include-hidden-files: true
          path: |
            .integration/flat-*/inputs.json
            .integration/flat-*/composition.diff
            .integration/flat-*/build.log
            .integration/flat-*/harts-*/*.log
            .integration/flat-*/harts-*/result.json
            .integration/flat-*/provider/server/tests/guest/flat/Cargo.lock
            .integration/flat-*/provider/server/tests/guest/flat/target/riscv64gc-unknown-none-elf/debug/flat-guest
            .integration/flat-*/provider/server/tests/guest/flat/target/riscv64gc-unknown-none-elf/release/flat-guest
          if-no-files-found: warn
      - name: Preserve native image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-memory
          path: .integration/vanllia/tests/memory/target/evidence/
          if-no-files-found: error

  room-comparison:
    name: Opt-in Room comparison
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.body, 'Room comparison: requested')
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    env:
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install comparison tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select published control
        id: control
        run: python3 server/tests/latency/ci.py --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Fetch control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.control.outputs.sha }}
          path: .integration/room-control
          persist-credentials: false
      - name: Fetch native composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/vanllia
          ref: dd32c35dbb67e2e78edb00ad35f968d16423249e
          path: .integration/vanllia
          sparse-checkout: |
            tests/memory
            platform/riscv
          persist-credentials: false
      - name: Compare fixed Room and UART workloads
        run: |
          for mode in room irq; do
            python3 server/tests/latency/run.py --kernel "$GITHUB_WORKSPACE" --baseline .integration/room-control --fixture .integration/vanllia --output ".integration/compare-$mode-on" --mode "$mode" --rounds 5
            python3 server/tests/latency/run.py --kernel "$GITHUB_WORKSPACE" --baseline .integration/room-control --fixture .integration/vanllia --output ".integration/compare-$mode-off" --mode "$mode" --rounds 5 --no-latency
          done
      - name: Fetch original provider for first-use study
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5ec49757b92e129822a50e543a999fb4ea509036
          path: .integration/room-first-use
          persist-credentials: false
      - name: Separate first timed wake from warmed scheduling
        run: python3 server/tests/latency/run.py --kernel .integration/room-first-use --fixture .integration/vanllia --output .integration/compare-warmup-on --mode room --harts 1 --rounds 5 --compare-room-warmup
      - name: Preserve every comparison boot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-comparison
          include-hidden-files: true
          path: |
            .integration/compare-*/order.json
            .integration/compare-*/*/inputs.json
            .integration/compare-*/*/composition.diff
            .integration/compare-*/*/build.log
            .integration/compare-*/*/harts-*/*.log
            .integration/compare-*/*/harts-*/result.json
            .integration/compare-*/*/composition/tests/memory/Cargo.lock
            .integration/compare-*/*/composition/tests/memory/target/riscv64gc-unknown-none-elf/release/memory-*
          if-no-files-found: warn
