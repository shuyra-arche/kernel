name: Check

# Documentation-only changes do not need Kernel builds or QEMU tests.
# Mixed source/documentation changes still run the complete checks.
# workflow_call intentionally remains unfiltered for releases.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_call:

permissions:
  contents: read

# PR updates supersede old work. Other runs have unique groups: main and
# reusable release checks must neither cancel nor evict one another from a queue.
concurrency:
  group: kernel-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  build:
    name: RV64 build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test QEMU partition contract
        run: python3 server/tests/hardware/tests/shard.py
      - name: Install CI toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,rustfmt,clippy --target riscv64gc-unknown-none-elf
      - name: Identify compiler
        id: compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/check.yml') }}
          restore-keys: |
            rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-
      - name: Test workspace on host
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo test --locked --workspace --target x86_64-unknown-linux-gnu
      - name: Build workspace (debug)
        run: cargo build --locked --workspace --target riscv64gc-unknown-none-elf
      - name: Build workspace (release)
        run: cargo build --locked --workspace --release --target riscv64gc-unknown-none-elf

  guest:
    name: Guest tests (QEMU)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    env:
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
      RUSTFLAGS: "-Crelocation-model=static -Cforce-frame-pointers=yes -Ccode-model=medium -Dwarnings"
    steps:
      - name: Install native image tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch native QEMU composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/vanllia
          ref: dd32c35dbb67e2e78edb00ad35f968d16423249e
          path: .integration/vanllia
          sparse-checkout: |
            tests/memory
            platform/riscv
          persist-credentials: false
      - name: Adapt historical fixture manifest to the current provider
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for relative in ['tests/memory', 'platform/riscv']:
              manifest = Path('.integration/vanllia') / relative / 'Cargo.toml'
              manifest.write_text(manifest.read_text().replace(', features = ["memory-v11"]', ''))
          PYTHON
      - name: Run current native provider (debug)
        run: python3 .integration/vanllia/tests/memory/run.py --kernel "$GITHUB_WORKSPACE"
      - name: Reject ABI 10 Capsule
        run: python3 .integration/vanllia/tests/memory/run.py --kernel "$GITHUB_WORKSPACE" --no-build --capsule-version 10
      - name: Run current native provider (release)
        run: python3 .integration/vanllia/tests/memory/run.py --kernel "$GITHUB_WORKSPACE" --profile release
      - name: Check implicit Flat contracts (debug, 1/4 Harts)
        run: python3 server/tests/guest/flat/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/flat-debug
      - name: Check implicit Flat contracts (release, 1/4 Harts)
        run: python3 server/tests/guest/flat/run.py --kernel "$GITHUB_WORKSPACE" --fixture .integration/vanllia --output .integration/flat-release --profile release
      - name: Preserve implicit Flat evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: implicit-flat
          include-hidden-files: true
          path: |
            .integration/flat-*/inputs.json
            .integration/flat-*/composition.diff
            .integration/flat-*/build.log
            .integration/flat-*/harts-*/*.log
            .integration/flat-*/harts-*/result.json
            .integration/flat-*/provider/server/tests/guest/flat/Cargo.lock
            .integration/flat-*/provider/server/tests/guest/flat/target/riscv64gc-unknown-none-elf/debug/flat-guest
            .integration/flat-*/provider/server/tests/guest/flat/target/riscv64gc-unknown-none-elf/release/flat-guest
          if-no-files-found: warn
      - name: Preserve native image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-memory
          path: .integration/vanllia/tests/memory/target/evidence/
          if-no-files-found: error
