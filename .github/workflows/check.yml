name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  build:
    name: RV64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install CI toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src,rustfmt,clippy --target riscv64gc-unknown-none-elf
      - name: Check host ABI boundaries
        run: |
          cargo test --locked -p kernel-api --tests --target x86_64-unknown-linux-gnu
          cargo test --locked -p kernel-client --test call --target x86_64-unknown-linux-gnu
          cargo test --locked -p kernel-api-macros --test declaration --target x86_64-unknown-linux-gnu
      - name: Check Cell, IOMMU and boot authority boundaries
        run: cargo test --locked --manifest-path server/tests/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Build workspace (debug)
        run: cargo build --locked --workspace --target riscv64gc-unknown-none-elf
      - name: Build workspace (release)
        run: cargo build --locked --workspace --release --target riscv64gc-unknown-none-elf
      - name: Build optional crash reporting
        run: cargo build --locked -p kernel --all-features --target riscv64gc-unknown-none-elf

  iommu-hardware:
    name: IOMMU command engine (QEMU)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install guest test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain nightly --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated hardware guest
        run: cargo +nightly test --locked --manifest-path server/tests/Cargo.toml --test hardware --target x86_64-unknown-linux-gnu -- --ignored --nocapture
      - name: Preserve hardware evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iommu-command-engine
          path: server/tests/target/iommu/target/evidence/
          if-no-files-found: warn
