name: Release

on:
  push:
    tags: ['[0-9][0-9].[0-9][0-9].[0-9][0-9]-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash tools/release.sh "$RELEASE_TAG" "$GITHUB_SHA"

  check:
    needs: version
    uses: ./.github/workflows/check.yml

  release:
    name: Publish source version
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=(--generate-notes)
          if [[ "$RELEASE_TAG" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}-preview-Alpha$ ]]; then
            sed -e "s/{{RELEASE_TAG}}/$RELEASE_TAG/g" \
                -e "s/{{RELEASE_COMMIT}}/$GITHUB_SHA/g" \
                docs/releases/preview-alpha.md > "$RUNNER_TEMP/release-notes.md"
            notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          args=(--verify-tag "${notes[@]}" --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}-(explore|develop|preview)- ]]; then
            args+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
