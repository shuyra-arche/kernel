[package]
name = "kernel-std-rt-opt-in-elf"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rt-opt-in"
path = "src/main.rs"
test = false
bench = false
doctest = false

[dependencies]
kernel-std = { path = "../.." }
kernel-std-rt = { path = "../../rt", features = [
  "entry",
  "panic-handler",
  "global-allocator",
] }
