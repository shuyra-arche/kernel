[workspace]
resolver = "3"
members = [
  "api",
  "tools/abi-macros",
  "client",
  "server",
  "server/sbi",
  "server/tests",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
kernel-api = { path = "api" }
bitflags = "2.13.1"
erra = { version = "0.2.0", default-features = false }
fack = { version = "0.2.0", default-features = false }

[profile.dev]
debug = true
panic = "abort"

[profile.release]
panic = "abort"
