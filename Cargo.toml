[workspace]
resolver = "3"
members = [
  "api",
  "api/abi-macros",
  "client",
  "server",
  "server/tests",
  "server/tests/basis/**/host",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
kernel-api = { path = "api" }
bitflags = "2.13.1"
erra = { version = "0.2.0", default-features = false }
fack = { version = "0.2.0", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["alloc", "default-hasher"] }

[profile.dev]
debug = true
panic = "abort"

[profile.release]
panic = "abort"

[patch."https://github.com/shuyra-arche/kernel.git"]
kernel-api = { path = "api" }
