[workspace]
resolver = "3"
members = [
  "api",
  "api/env",
  "api/wire",
  "api/macros",
  "client",
  "server",
  "server/allocator",
  "server/sbi",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
env = { package = "kernel-api-env", path = "api/env" }
bitflags = "2.13.1"
erra = { version = "0.2.0", default-features = false }
fack = { version = "0.2.0", default-features = false }

[profile.dev]
debug = true
panic = "abort"

[profile.release]
panic = "abort"

# Keep iommu-hold on the same canonical ABI owner as this workspace.
[patch."https://github.com/shuyra-arche/kernel.git"]
kernel-api-env = { path = "api/env" }
